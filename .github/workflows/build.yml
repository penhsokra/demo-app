name: DevSecOps Optimized

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Build and Run Unit Tests (Generates JaCoCo reports)
      - name: Unit Tests & Coverage
        run: mvn clean test jacoco:report

      # 2. Run SpotBugs (Static Analysis)
      - name: SpotBugs Static Analysis
        run: mvn spotbugs:check -DfailOnError=false

      # 3. Run OWASP Dependency Check (Vulnerability Scan)
      # - name: Dependency Check Scan
      #   run: |
      #     mvn org.owasp:dependency-check-maven:check \
      #       -DnvdApiKey=${{ env.NVD_API_KEY }} \
      #       -Dformats=JSON,HTML

      # 4. Upload Reports to GitHub Artifacts (All Paths Included)
      - name: Upload Security & Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-analysis-reports
          path: |
            target/site/jacoco/
            target/spotbugsXml.xml
            target/dependency-check-report.json
            target/dependency-check-report.html
            target/surefire-reports/

      # 5. Upload all results to SonarQube
      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }} \
            -Dsonar.projectKey=demo-app \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.spotbugs.reportPaths=target/spotbugsXml.xml \
            -Dsonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json \
            -Dsonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html \
            -Dsonar.qualitygate.wait=true