name: DevSecOps Optimized (Sequential)

on:
  push:
    branches: [main]
  workflow_dispatch:

# GLOBAL ENVIRONMENT VARIABLES
env:
  SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
  SONAR_PROJECT_KEY: "demo-app"
  # WARNING: Moving tokens to plain text is less secure than Secrets
  SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
  NVD_API_KEY: ${{secrets.NVD_API_KEY}}

jobs:
  # 1. UNIT TESTS & COVERAGE
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests & JaCoCo
        run: mvn clean test jacoco:report

      - name: Share Test Assets
        uses: actions/upload-artifact@v4
        with:
          name: test-assets
          path: |
            target/classes
            target/site/jacoco/jacoco.xml
            pom.xml

  # 2. BUGS STATIC ANALYSIS
  spotbugs-analysis:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-assets
      
      - name: Run SpotBugs
        run: mvn spotbugs:check -DfailOnError=false

      - name: Share SpotBugs Report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-assets
          path: target/spotbugsXml.xml

  # 3. DEPENDENCY CHECK
  dependency-scan:
    needs: spotbugs-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DnvdApiKey=${{ env.NVD_API_KEY }} \
            -Dformats=JSON,HTML

      - name: Share Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-assets
          path: |
            target/dependency-check-report.json
            target/dependency-check-report.html

  # 4. SONARQUBE ANALYSIS
  sonarqube:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/download-artifact@v4
        with:
          name: test-assets
      - uses: actions/download-artifact@v4
        with:
          name: spotbugs-assets
      - uses: actions/download-artifact@v4
        with:
          name: dependency-assets

      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.spotbugs.reportPaths=target/spotbugsXml.xml \
            -Dsonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json \
            -Dsonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html \
            -Dsonar.qualitygate.wait=true