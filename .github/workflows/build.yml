name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Maven Build & Tests (JUnit)
      - name: Maven Build & Tests
        run: |
          mvn clean verify

      # 4️⃣ Upload JUnit Reports (XML + HTML)
      - name: Upload JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            target/surefire-reports/*.xml
            target/site/surefire-report.html

      # 5️⃣ Coverage & Static Analysis
      - name: Maven Coverage & Static Analysis
        run: |
          mvn jacoco:report checkstyle:checkstyle pmd:pmd spotbugs:spotbugs site

      # 6️⃣ Upload Quality Reports (XML + HTML)
      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/cpd.xml
            target/spotbugsXml.xml
            target/site/checkstyle.html
            target/site/pmd.html
            target/site/spotbugs.html
            target/site/jacoco/index.html

      # 7️⃣ Install Snyk CLI
      - name: Install Snyk
        uses: snyk/actions/setup@master
        with:
          snyk-version: 'latest'

      # 8️⃣ Run Snyk vulnerability scan (JSON + HTML)
      - name: Run Snyk Scan
        run: |
          snyk test --all-projects --json > snyk-report.json
          snyk test --all-projects --html > snyk-report.html

      # 9️⃣ Upload Security Reports (JSON + HTML)
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            snyk-report.json
            snyk-report.html

      # 🔟 SonarQube Scan (Aggregates all reports)
      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.login=${{ env.SONAR_TOKEN }}
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.projectKey=${{ github.repository }}
            -Dsonar.java.coveragePlugin=jacoco
            -Dsonar.junit.reportPaths=target/surefire-reports
            -Dsonar.jacoco.reportPaths=target/jacoco/jacoco.xml
            -Dsonar.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.pmd.reportPaths=target/pmd.xml
            -Dsonar.spotbugs.reportPaths=target/spotbugsXml.xml
            -Dsonar.externalIssuesReportPaths=snyk-report.json