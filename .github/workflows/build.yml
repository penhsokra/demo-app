name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3️⃣ Maven Build & Tests (JUnit)
      - name: Maven Build & Tests
        run: |
          mvn clean verify

      # 4️⃣ Upload JUnit Reports (XML + HTML)
      - name: Upload JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            target/surefire-reports/*.xml
            target/site/surefire-report.html

      # 5️⃣ Coverage & Static Analysis
      - name: Maven Coverage & Static Analysis
        run: |
          mvn jacoco:report checkstyle:checkstyle pmd:pmd spotbugs:spotbugs site

      # 6️⃣ Upload Quality Reports (XML + HTML)
      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/cpd.xml
            target/spotbugsXml.xml
            target/site/checkstyle.html
            target/site/pmd.html
            target/site/spotbugs.html
            target/site/jacoco/index.html
            target/site/**


      # 7️⃣ Install Snyk CLI
      - name: Install Snyk
        uses: snyk/actions/setup@master
        with:
          snyk-version: 'latest'

      # 8️⃣ Run Snyk vulnerability scan (JSON + HTML)
      - name: Run Snyk Scan
        run: |
          snyk test --all-projects --json > snyk-report.json || true  
          snyk test --all-projects --html > snyk-report.html || true

      # 9️⃣ Upload Security Reports (JSON + HTML)
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            snyk-report.json
            snyk-report.html

      # 10 OWASP Dependency Check
      # - name: OWASP Dependency Check
      #   run: |
      #     mvn org.owasp:dependency-check-maven:check

      # - name: Upload Security Reports
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: security-reports
      #     path: |
      #       target/dependency-check-report.html
      #       target/dependency-check-report.xml

      # 11 SonarQube Scan (Aggregating all reports)
      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }} \
            -Dsonar.projectKey=demo-app \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
            -Dsonar.java.pmd.reportPaths=target/pmd.xml \
            -Dsonar.java.spotbugs.reportPaths=target/spotbugsXml.xml \
            -Dsonar.externalIssuesReportPaths=snyk-report.json

      # 12 SonarQube Quality Gate
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}  