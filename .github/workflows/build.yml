name: DevSecOps Optimized

on:
  push:
    branches: [main]

# GLOBAL ENVIRONMENT VARIABLES (Moved from Secrets)
env:
  SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
  SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
  SONAR_PROJECT_KEY: "demo-app"
  NVD_API_KEY: ${{secrets.NVD_API_KEY}}

jobs:
  # 1. BUILD JOB
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build
        run: mvn clean compile test jacoco:report

      - name: Share Build Assets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            target/classes
            target/site/jacoco/jacoco.xml
            target/site/**
            pom.xml

  # 2. SECURITY JOB (Your OWASP Path)
  # security-scans:
  #   name: Security Scans
  #   needs: build-and-test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
      
  #     - name: Run OWASP Dependency Check
  #       run: |
  #         mvn org.owasp:dependency-check-maven:check \
  #           -DnvdApiKey=${{ env.NVD_API_KEY }} \
  #           -Dformats=JSON,HTML \
  #           -DossindexAnalyzerEnabled=false

  #     - name: Share Security Reports
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: security-reports
  #         path: |
  #           target/dependency-check-report.json
  #           target/dependency-check-report.html
  #           target/dependency-check-report.xml

  # 2. SECURITY JOB (Optimized for Speed & SonarQube)
  security-scans:
    name: Security Scans
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # STEP A: Cache the NVD Database to prevent slow downloads
      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dep-check-data
          restore-keys: |
            ${{ runner.os }}-dep-check-data

      # STEP B: Run scan with XML format and API Key
      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -Dformats=XML,JSON,HTML \
            -DossindexAnalyzerEnabled=false
        # Note: Ensure NVD_API_KEY is stored in your GitHub Repo Secrets

      # STEP C: Share Reports (Now includes XML)
      - name: Share Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            target/dependency-check-report.json
            target/dependency-check-report.html
            target/dependency-check-report.xml

  # 3. SONARQUBE JOB
  sonarqube-analysis:
    name: SonarQube Analysis
    needs: security-scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Download ALL reports from previous steps
      - uses: actions/download-artifact@v4
        with:
          name: build-assets
      - uses: actions/download-artifact@v4
        with:
          name: security-reports

      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.dependencyCheck.reportPath=target/dependency-check-report.xml \
            -Dsonar.qualitygate.wait=true