name: DevSecOps Optimized

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1️⃣ BUILD JOB: Compiles code and runs tests
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Test
        run: mvn clean test jacoco:report

      - name: Upload Build Assets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            target/classes/
            target/site/jacoco/jacoco.xml
            pom.xml

  # 2️⃣ JOB: SPOTBUGS (Runs in parallel with Dependency Scan)
  spotbugs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-assets
      
      - name: Run SpotBugs
        run: mvn spotbugs:check -DfailOnError=false

      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml

  # 3️⃣ JOB: DEPENDENCY CHECK (Runs in parallel with SpotBugs)
  dependency-check:
    needs: build
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DnvdApiKey=${{ env.NVD_API_KEY }} \
            -Dformats=JSON,HTML

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            target/dependency-check-report.json
            target/dependency-check-report.html

  # 4️⃣ JOB: SONARQUBE ANALYSIS (Waits for all scans to finish)
  sonarqube:
    needs: [build, spotbugs, dependency-check]
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Download all artifacts for the final scan
      - uses: actions/download-artifact@v4
        with:
          name: build-assets
      - uses: actions/download-artifact@v4
        with:
          name: spotbugs-report
      - uses: actions/download-artifact@v4
        with:
          name: dependency-reports

      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }} \
            -Dsonar.projectKey=demo-app \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.spotbugs.reportPaths=target/spotbugsXml.xml \
            -Dsonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json \
            -Dsonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html \
            -Dsonar.qualitygate.wait=true