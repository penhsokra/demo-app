name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1️⃣ JOB: BUILD
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Compile and Test
        run: mvn clean verify
      
      - name: Share Build Assets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            target/classes
            target/surefire-reports
            pom.xml

  # 2️⃣ JOB: QUALITY ANALYSIS (Checkstyle, PMD, Jacoco)
  quality-analysis:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-assets
      
      - name: Run Static Analysis & Coverage
        run: mvn jacoco:report checkstyle:checkstyle pmd:pmd spotbugs:spotbugs -DskipTests

      - name: Upload Quality Reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/site/jacoco/jacoco.xml
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml

  # 3️⃣ JOB: SECURITY SCAN (Snyk & OWASP)
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-assets
      
      # - name: OWASP Dependency Check
      #   run: |
      #     mvn org.owasp:dependency-check-maven:check \
      #       -Dformats=XML,HTML -DnvdApiKey=${{ env.NVD_API_KEY }}

      - name: Snyk Scan & Conversion
        run: |
          npm install -g snyk snyk-to-sonar
          snyk test --all-projects --json > snyk-report.json || true
          snyk-to-sonar -i snyk-report.json -o snyk-sonar.json

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            # target/dependency-check-report.xml
            snyk-sonar.json

  # 4️⃣ JOB: SONARQUBE & QUALITY GATE
  sonarqube:
    needs: [quality-analysis, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: build-assets
      - uses: actions/download-artifact@v4
        with:
          name: quality-reports
      - uses: actions/download-artifact@v4
        with:
          name: security-reports

      - name: SonarQube Scan & Wait for Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }} \
            -Dsonar.projectKey=demo-app \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
            -Dsonar.java.pmd.reportPaths=target/pmd.xml \
            -Dsonar.java.spotbugs.reportPaths=target/spotbugsXml.xml \
            # -Dsonar.dependencyCheck.xmlReportPath=target/dependency-check-report.xml \
            -Dsonar.externalIssuesReportPaths=snyk-sonar.json \
            -Dsonar.qualitygate.wait=true